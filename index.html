<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Add HDI Ohio events to your calendar.">
  <title>HDI Ohio Calendar Helper</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #15324b;
      --blue: #1778b5;
      --pale: #eef6fb;
      --text: #25313b;
      --muted: #65737e;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(145deg, var(--pale), var(--white) 62%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      max-width: 680px;
      padding: 48px 42px;
      border-top: 6px solid var(--blue);
      border-radius: 8px;
      background: var(--white);
      box-shadow: 0 18px 45px rgba(21, 50, 75, 0.13);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(32px, 6vw, 50px);
      line-height: 1.05;
    }

    p {
      margin: 22px auto 0;
      max-width: 540px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--pale);
      color: var(--navy);
      font-size: 14px;
      font-weight: 700;
    }

    @media (max-width: 520px) {
      main { padding: 38px 24px; }
      p { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">HDI Ohio</p>
    <h1>Calendar Helper</h1>
    <p>Soon you will be able to add any HDI Ohio event to Google Calendar, Microsoft Outlook, or your device calendar in one click.</p>
    <span class="status">Infrastructure is live</span>
  </main>
</body>
</html>
